<script type="text/x-dc" data-dc-script data-props='{"deficit":{"editor":"range","default":423,"min":0,"max":1700,"step":10,"section":"Preview"},"gramsTarget":{"editor":"int","default":200,"section":"Preview"},"stepsDone":{"editor":"range","default":0.64,"min":0,"max":1,"step":0.01,"section":"Preview"},"nzHour":{"editor":"range","default":14.53,"min":0,"max":23.99,"step":0.25,"section":"Preview"},"animate":{"editor":"boolean","default":true,"section":"Preview"},"$preview":{"width":454,"height":454}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => {
if (this.props.animate === false) return;
const s = Math.floor(Date.now() / 1000);
if (!this.state || this.state.sec !== s) this.setState({ sec: s });
}, 250);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const num = (v, d) => { const n = parseFloat(v); return isNaN(n) ? d : n; };
const pad = (n) => String(n).padStart(2, '0');
const nzHour = ((num(this.props.nzHour, 14.53) % 24) + 24) % 24;
let hh = Math.floor(nzHour);
let mm = Math.round((nzHour - hh) * 60);
if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }

const deficit = Math.max(0, num(this.props.deficit, 423));
const gramsTarget = Math.max(20, Math.round(num(this.props.gramsTarget, 200)));
const target = gramsTarget * 7.7;
const grams = Math.round(deficit / 7.7);
const thresholds = [100, 250, 750, target];
let raw = 0;
for (const th of thresholds) if (deficit >= th) raw++;
const L = [0, 1, 3, 4, 5][raw];
const labels = ['DYING', 'RESTING', 'WARMING UP', 'ACTIVE', 'INTENSE', 'TARGET REACHED'];
const p = Math.max(0, Math.min(1, deficit / target));

const sec = (this.state && this.state.sec) || 0;
const odd = sec % 2 === 1;
const slowOdd = Math.floor(sec / 2) % 2 === 1;

const bodyT = L === 0 ? (odd ? 'rotate(-4 100 160) translate(-1 4)' : 'rotate(4 100 160) translate(1 4)') : L === 5 && sec % 2 === 1 ? 'translate(0 -5)' : 'translate(0 0)';
const headT = L === 0 ? (odd ? 'rotate(17 100 76) translate(0 5)' : 'rotate(-17 100 76) translate(0 5)') : 'rotate(0 100 74)';
const punchStep = L === 5 ? sec % 4 : 0;
const sq = (L === 3 || L === 4) && odd ? 1 : 0;
const sx = { 3: 0.86, 4: 1.0, 5: 1.15 }[L] || 1;
const as = { 3: 0.8, 4: 1.0, 5: 1.2 }[L] || 1;
const armBulkT = L >= 3 ? 'translate(' + ((63 - 100) * (sx - 1)).toFixed(2) + ' 0) translate(63 86) scale(' + as + ') translate(-63 -86)' : 'translate(0 0)';
const torsoT = L >= 3 ? 'translate(100 0) scale(' + sx + ' 1) translate(-100 0)' : 'translate(0 0)';
const raiseT = L === 5 && punchStep % 2 === 1 ? 'rotate(-16 63 86)' : 'rotate(-8 63 86)';
const upperArm = 'M66 78 C58 ' + (71 - 3 * sq) + ' 50 ' + (67 - 4 * sq) + ' 42 ' + (68 - 3 * sq) + ' C36 ' + (69 - 3 * sq) + ' 33 71 32 75 L29 77 C23 80 21 86 23 91 C27 96 36 99 48 99 C56 99 62 98 66 95 Z';
const curlT = sq ? 'rotate(3 30 80)' : 'rotate(0 30 80)';
const armLines = L === 5 ? 'M54 56 C58 62 62 66 66 74 M44 64 C47 62 50 60 54 58 M40 48 C42 44 43 40 44 36 M33.5 15 L33.5 21.5 M39 14.5 L39 21.5 M45 14.5 L45 21.5 M29 21.5 L50 21.5 M30 27 C36 24.5 42 25 47.5 28 M58 80 C60 86 61 92 60 96' : L === 0 ? 'M68 84 C58 85 48 86 38 88 M68 92 C58 92 48 93 38 94 M31 100 L31.5 105 M34 101 L34.2 107 M36.5 100 L36.3 104' : L >= 2 ? 'M66 80 C58 ' + (73 - 3 * sq) + ' 50 ' + (69 - 4 * sq) + ' 42 ' + (70 - 3 * sq) + ' C37 ' + (71 - 3 * sq) + ' 34 72 33 76 M62 91 C52 89 40 87 31 82 M56 80 C60 84 62 90 61 96' : 'M61 156 L61 162.5 M65 156.5 L65 163.5 M69 156 L69 162.5 M58.5 155.5 L73.5 155.5 M60 150 C63 152 67 152 71 150.5 M70.5 86 C71.5 102 72 122 71 146 M61 118 C63 116 67 116 70 118';
const armLinesB = L === 3 || L === 4 ? 'M38 49 L53 49 M33 75 C31 80 29 83 26 86 M45 30 L45 35 M50 30 L50 35 M55 31 L55 36 M40 44 C45 42 51 42 56 44' : '';

const BASE = 'M100 47 L99 56 Q100 57.5 101.5 56.5 M97.5 56 Q99 57.5 100 57 M102.5 56 Q101 57.5 100 57 M98 66 Q100 67 102 66 M90 56 Q92 60 95 63 M110 56 Q108 60 105 63';
const face = L === 0 ? 'M100 47 L99 56 Q100 57.5 101.5 56.5 M90 56 Q92 60 95 63 M110 56 Q108 60 105 63' : BASE + ' M90.5 45 L97 44.5 M103 44.5 L109.5 45 M92 48.5 Q94 47.6 96 48.5 M104 48.5 Q106 47.6 108 48.5 M93.4 49.4 L94.6 49.4 M105.4 49.4 L106.6 49.4 M96 61.6 L104 61.6';

const surface = L === 0 ? 200 : p >= 0.995 ? -60 : 162 - p * 136;
let wave = 'M-120 260 L-120 ' + surface.toFixed(1);
for (let x = -120; x <= 320; x += 10) {
const y = surface + (p > 0.995 ? 0 : Math.sin(x / 9) * 1.4);
wave += ' L' + x + ' ' + y.toFixed(2);
}
wave += ' L320 260 Z';
let dry = 'M-120 -200 L320 -200';
const wp = wave.split(' L').slice(1, -1).reverse();
dry += ' L' + wp.join(' L') + ' Z';

const zStep = sec % 3;
const zzz = L === 1 ? [0, 1, 2].filter((k) => k <= zStep).map((k) => ({ x: 120 + k * 7, y: 40 - k * 9, s: 9 + k * 3, o: k === zStep ? 1 : 0.45 })) : [];
const dropAt = (x, y, s) => 'M' + x + ' ' + y + ' q' + (-3.2 * s).toFixed(2) + ' ' + (4.6 * s).toFixed(2) + ' 0 ' + (6.6 * s).toFixed(2) + ' q' + (3.2 * s).toFixed(2) + ' ' + (-2 * s).toFixed(2) + ' 0 ' + (-6.6 * s).toFixed(2) + ' Z';
const dropSeeds = [[118, 36, 1, 0], [82, 38, 0.9, 1], [121, 52, 0.8, 2], [79, 54, 0.75, 0], [30, 36, 0.8, 1], [170, 36, 0.8, 2], [104, 30, 0.7, 1], [58, 101, 0.95, 0], [48, 100, 0.8, 2], [38, 98, 0.7, 1], [142, 101, 0.95, 1], [152, 100, 0.8, 0], [162, 98, 0.7, 2]];
const drops = L === 4 ? dropSeeds.map((d) => { const q = (sec + d[3]) % 3; const fall = d[1] > 90 ? 8 : 6; return { d: dropAt(d[0], d[1] + q * fall, d[2]), o: (0.95 - q * 0.25).toFixed(2) }; }) : [];
const star = (x, y, s) => 'M' + x + ' ' + (y - s) + ' Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) + ' Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + ' Z';
const sparkSeeds = [[14, 56, 0], [186, 58, 1], [70, 26, 2], [130, 24, 0], [16, 108, 1], [184, 104, 2], [30, 146, 0], [170, 148, 1]];
const sparks = L === 5 ? sparkSeeds.map((s) => { const q = (sec + s[2]) % 3; const sz = [6, 3.5, 1.5][q]; return { d: star(s[0], s[1], sz), o: [1, 0.6, 0.25][q] }; }) : [];

const rightPunch = false;
const ringStep = sec % 3;
const rings = false ? [0, 1, 2].map((k) => {
const r = 4 + k * 5;
const o = k === ringStep ? 0.9 : k === (ringStep + 2) % 3 ? 0.32 : 0.1;
return { id: 'mRing' + k, url: 'url(#mRing' + k + ')', r, r2: r - 1.4, o };
}) : [];

const skinny = L <= 1;
const torso = skinny ? 'M90 72 C84 75 76 76 70 80 C66 90 68 104 72 114 C76 128 80 144 84 160 L116 160 C120 144 124 128 128 114 C132 104 134 90 130 80 C124 76 116 75 110 72 Z' : 'M88 72 C80 76 69 76 60 82 C55 92 57 104 62 112 C67 126 76 142 82 160 L118 160 C124 142 133 126 138 112 C143 104 145 92 140 82 C131 76 120 76 112 72 Z';
const neck = skinny ? 'M94 62 L106 62 L109 76 L91 76 Z' : 'M91 62 L109 62 L114 76 L86 76 Z';
const torsoLines = skinny ? 'M90 76 C84 78 78 79 72 81 M110 76 C116 78 122 79 128 81 M100 84 L100 114 M86 94 C82 96 78 99 75 103 M86 102 C82 104 78 107 76 111 M87 110 C83 112 80 115 78 119 M114 94 C118 96 122 99 125 103 M114 102 C118 104 122 107 124 111 M113 110 C117 112 120 115 122 119 M92 136 C96 140 104 140 108 136 M100 140 L100 146' : 'M100 86 C92 100 78 102 68 94 M100 86 C108 100 122 102 132 94 M92 68 C86 72 78 74 70 77 M108 68 C114 72 122 74 130 77 M100 104 L100 154 M89 114 C95 116 105 116 111 114 M89 126 C95 128 105 128 111 126 M90 138 C95 140 105 140 110 138 M87 106 C84 124 85 142 90 156 M113 106 C116 124 115 142 110 156 M74 108 L79 112 M75 116 L80 119 M77 124 L81 126 M126 108 L121 112 M125 116 L120 119 M123 124 L119 126';
const lineC = ['#B4C98A', '#9c917a', '#D2C09A', '#E2CFA4', '#EBD9AE', '#F7ECD3'][L];
const liquidC = L === 0 ? '#6b665d' : '#E8D5A8';

const norm = (d) => ((d % 360) + 360) % 360;
const sDone = Math.max(0, Math.min(1, num(this.props.stepsDone, 0.64)));
const sLen = 110 * sDone;
const dLen = 110 * p;
const fill = (len, start, col) => ({ da: len.toFixed(2) + ' ' + (360 - len).toFixed(2), off: -norm(start), c: len > 0.5 ? col : 'transparent' });

return {
hh: pad(hh),
mm: pad(mm),
grams,
gramsTarget,
kcal: Math.round(deficit).toLocaleString('en-NZ'),
stateLabel: labels[L],
stateC: L === 0 ? '#FF7B6B' : '#FFFFFF',
gramsC: L === 0 ? '#c9c0b0' : '#E8D5A8',
bodyT,
headT,
armLines,
armLinesB,
upperArm,
curlT,
rightT: 'rotate(0 63 86)',
rightFlex: !rightPunch,
rightPunch,
rCurlT: curlT,
rUpperArm: upperArm,
rLinesA: rightPunch ? 'M66 83 C59 74 51 63 45 54 M60 92 C55 82 48 70 42 60 M33 46 C37 42 42 40 46 41 M31 41 L35 37 M35 37 L40 34' : armLines,
rLinesB: rightPunch ? '' : armLinesB,
burst: '',
flexArms: L === 3 || L === 4,
raisedArms: L === 5,
raiseT,
burstT: armBulkT + ' ' + raiseT,
armBulkT,
torsoT,
downArms: L === 1,
zombieArms: L === 0,
zL: L === 0 ? 'rotate(6 70 88)' : L === 5 ? raiseT : 'rotate(0)',
zR: L === 0 ? 'rotate(-9 70 88)' : L === 5 ? raiseT : 'rotate(0)',
torso,
neck,
torsoLines,
drops,
sparks,
baseC: L === 0 ? '#243020' : '#1d1914',
wave,
lineC,
liquidC,
figOp: L === 0 ? (odd ? 0.82 : 1) : 1,
dying: L === 0,
stateOp: L === 0 ? (odd ? 0.45 : 1) : 1,
figGlow: L === 5 ? 'url(#mGlow)' : 'none',
dry,
face,
zzz,
rings,
fs: fill(sLen, 125, 'url(#mSteps)'),
fd: fill(dLen, 55 - dLen, 'url(#mDef)'),
ariaLabel: 'Muscle man, ' + labels[L].toLowerCase() + ', ' + grams + ' grams fat equivalent'
};
}
